name: Create Release Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Deployment Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, zip, pdo, mysql
          coverage: none

      - name: Install locked production dependencies
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test -f composer.lock
          composer validate --strict
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
          git diff --exit-code -- composer.json composer.lock

      - name: Publish assets and validate runtime
        run: |
          set -euo pipefail
          TAG_NAME=${GITHUB_REF#refs/tags/}
          php scripts/publish_theme_assets.php
          php scripts/build_distribution_manifest.php --tag "$TAG_NAME"
          php scripts/validate_release.php --tag "$TAG_NAME"

      - name: Create Deployment ZIP
        run: |
          set -euo pipefail
          TAG_NAME=${GITHUB_REF#refs/tags/}
          ZIP_NAME="chascarrillo-deploy-${TAG_NAME}.zip"

          zip -D -r "$ZIP_NAME" . \
            -x "*.git*" \
            -x ".htaccess" \
            -x "*/.htaccess" \
            -x "Content" \
            -x "Content/*" \
            -x "storage" \
            -x "storage/*" \
            -x "var" \
            -x "var/*" \
            -x "public_html/uploads" \
            -x "public_html/uploads/*" \
            -x "config.json" \
            -x ".env" \
            -x "tmp/*" \
            -x ".phpunit.cache" \
            -x ".phpunit.cache/*" \
            -x "docs/audit/*" \
            -x "coverage/*" \
            -x "reports/*" \
            -x ".DS_Store" \
            -x "*/.DS_Store" \
            -x "*.log" \
            -x "*.tmp" \
            -x "*.zip" \
            -x "Tests/*" \
            -x "phpunit.xml" \
            -x "phpcs.xml" \
            -x "phpstan.neon" \
            -x "phpstan-bootstrap.php" \
            -x "psalm.xml" \
            -x "psalm-stubs.php" \
            -x ".agents/*" \
            -x ".codex/*" \
            -x ".github/*" \
            -x "$ZIP_NAME"

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Verify packaged ZIP
        run: |
          set -euo pipefail
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERIFY_DIR=$(mktemp -d)
          unzip -q "$ZIP_NAME" -d "$VERIFY_DIR"
          test -f "$VERIFY_DIR/vendor/alxarafe/alxarafe/templates/partial/user_menu.blade.php"
          test -f "$VERIFY_DIR/vendor/alxarafe/alxarafe/templates/partial/body_standard.blade.php"
          test -f "$VERIFY_DIR/vendor/alxarafe/alxarafe/templates/partial/body_empty.blade.php"
          test -f "$VERIFY_DIR/public_html/themes/default/css/default.css"
          php scripts/validate_release.php "$VERIFY_DIR" --artifact --tag "$TAG_NAME"

      - name: Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
